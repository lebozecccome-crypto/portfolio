function updateButton(){const label=running?'Pause animation':'Play animation';playButton.setAttribute('aria-label',label);playButton.title=label;playButton.innerHTML=running?'<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6 4v12M14 4v12" stroke-width="2.5" fill="none"/></svg>':'<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6 4l10 6-10 6z" stroke="none"/></svg>';}
function tick(time){request=0;if(running&&active&&!document.hidden){if(lastTime)phase=(phase+Math.min(time-lastTime,100)/7500)%1;lastTime=time;amplitude=15*(1-Math.cos(2*Math.PI*phase));draw();request=requestAnimationFrame(tick);}}
function schedule(){if(running&&active&&!document.hidden&&!request){lastTime=0;request=requestAnimationFrame(tick);}}
function pause(){running=false;if(request)cancelAnimationFrame(request);request=0;lastTime=0;updateButton();}
function resize(){const rect=canvas.getBoundingClientRect();width=Math.max(1,rect.width);height=Math.max(1,rect.height);dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);draw();}
playButton.addEventListener('click',()=>{if(running)pause();else{running=true;updateButton();schedule();}});
resetButton.addEventListener('click',()=>{pause();phase=0;amplitude=0;draw();});
slider.addEventListener('input',()=>{pause();amplitude=Number(slider.value);phase=Math.acos(1-amplitude/15)/(2*Math.PI);draw();});
document.querySelectorAll('[data-mode]').forEach(button=>button.addEventListener('click',()=>{mode=button.dataset.mode;updateMode();draw();}));
document.getElementById('load-kind').addEventListener('change',event=>{loadKind=event.target.value;rebuildLoads();updateMode();draw();});
cameraButton.addEventListener('click',()=>{azimuth=-.62;elevation=.64;zoom=1;draw();});
canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,azimuth,elevation};canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{if(!drag)return;azimuth=drag.azimuth+(e.clientX-drag.x)*.006;elevation=Math.max(-.15,Math.min(1.45,drag.elevation+(e.clientY-drag.y)*.006));draw();});
canvas.addEventListener('pointerup',()=>{drag=null;});canvas.addEventListener('pointercancel',()=>{drag=null;});
canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.65,Math.min(5,zoom*Math.exp(-e.deltaY*.001)));draw();},{passive:false});
reducedMotion.addEventListener('change',e=>{if(e.matches){pause();amplitude=25;phase=Math.acos(1-25/15)/(2*Math.PI);draw();}});
function suspend(){if(request)cancelAnimationFrame(request);request=0;lastTime=0;}
document.addEventListener('visibilitychange',()=>{if(document.hidden)suspend();else schedule();});
window.addEventListener('message',event=>{
 if(event.source!==window.parent||!event.data||event.data.type!=='portfolio-animation'||typeof event.data.active!=='boolean')return;
 active=event.data.active;if(active){draw();schedule();}else suspend();
});
window.addEventListener('keydown',event=>{
 if(!embedded||!active||!['Escape','ArrowLeft','ArrowRight'].includes(event.key))return;
 if(event.key!=='Escape'&&event.target.closest('input,select,textarea'))return;
 event.preventDefault();window.parent.postMessage({type:'portfolio-navigation',key:event.key},'*');
});
rebuildLoads();updateMode();new ResizeObserver(resize).observe(canvas);updateButton();resize();schedule();
window.dosAguasView={metadata:{case:data.case,maximum_displacement_mm:data.maximum_displacement_mm,members:data.members.length,vertices:vertices.length/22,triangles:triangles.length/3,representation:'Solid timber with bending, roof loads, displacement and monochrome modes.',maximum_bending_kNm:data.maximum_bending_kNm}};


} catch(error) {
 const scene=document.querySelector('.scene');scene.replaceChildren();
 const notice=document.createElement('p');notice.className='fallback';
 notice.textContent='The interactive timber frame requires WebGL. Use the adjacent axonometric drawing to view the structure.';scene.append(notice);
 document.querySelectorAll('button,input,select').forEach(control=>control.disabled=true);
 document.querySelector('.readings').hidden=true;
 console.warn('Timber animation unavailable:',error.message);
}
</script>
</body></html>
