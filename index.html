<script>
/* Avant le premier paint : js / entrée mémorisée pour la session / retour interne / ?seuil rejoue l'entrée.
   Le gestionnaire d'entrée est posé ici : le seuil est actif avant l'arrivée de three.js. */
(function(){
  var d = document.documentElement; d.classList.add('js');
  try {
    if (location.search.indexOf('seuil') > -1) { sessionStorage.removeItem('entre'); }
    else if (sessionStorage.getItem('entre') === '1' || (document.referrer && document.referrer.indexOf(location.origin) === 0)) {
      d.classList.add('entered', 'direct', 'libre');
    }
    if (sessionStorage.getItem('tactile') === '1') d.classList.add('tactile');
  } catch (e) {}
  function tactile(e){ if (e.pointerType === 'touch') { d.classList.add('tactile'); try { sessionStorage.setItem('tactile', '1'); } catch (err) {} removeEventListener('pointerdown', tactile, true); } }
  addEventListener('pointerdown', tactile, { capture:true, passive:true });
  window.entrer = function(){
    if (d.classList.contains('entered')) return;
    d.classList.add('entered');
    try { sessionStorage.setItem('entre', '1'); } catch (e) {}
    dispatchEvent(new CustomEvent('entree'));
    setTimeout(function(){ d.classList.add('libre'); var s = document.getElementById('seuil'); if (s) { s.hidden = true; s.inert = true; } }, 1500);
  };
})();
</script>
<link rel="stylesheet" href="assets/css/site.css">

</div>
<script>
(function(){
  var s = document.getElementById('seuil'), b = s.querySelector('.entrer');
  if (matchMedia('(hover:none)').matches) b.textContent = 'toucher pour entrer';
  s.addEventListener('click', window.entrer);
  b.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); window.entrer(); } });
})();
</script>

<script>
/* three.js et la nébuleuse ne sont chargés qu'au premier passage */
if (!document.documentElement.classList.contains('direct')) {
  var s = document.createElement('script'); s.src = 'three.min.js';
  s.onload = function(){
    if (document.documentElement.classList.contains('entered')) { var c = document.getElementById('galaxie'); if (c) c.remove(); return; }
    var g = document.createElement('script'); g.src = 'assets/js/galaxie.js'; document.body.appendChild(g);
  };
  document.body.appendChild(s);
}
